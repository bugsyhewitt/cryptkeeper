[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptkeeper"
version = "0.2.0"
description = "TLS/SSL misconfiguration scanner for bug bounty and pentesting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
cryptkeeper = "cryptkeeper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptkeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["src", ".git", "dist", "build", "*.egg-info"]
